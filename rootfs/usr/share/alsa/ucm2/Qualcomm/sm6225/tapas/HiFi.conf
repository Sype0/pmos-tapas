# Use case configuration for the Xiaomi Redmi Note 12 4G (tapas):
# WCD9370 behind the LPASS RX/TX macros, AudioReach (q6apm) front ends.
# MultiMedia1 (hw:0,0) plays to RX_CODEC_DMA_RX_0, MultiMedia2 (hw:0,1)
# records from TX_CODEC_DMA_TX_3.
# Speaker: RX INT2 -> WCD AUX -> aw87xxx amplifier
# Earpiece: RX INT2 -> WCD EAR; Headphones: RX INT0/1 -> WCD HPHL/R
# RX INT2 reaches the WCD9370 on its SoundWire LO port: without 'LO Switch'
# the port carries no samples, and the amplifier only clicks on and off.
# Mic: AMIC1 -> WCD ADC1; headset mic: AMIC2 -> ADC2

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT2_1 MIX1 INP0' RX0"
		cset "name='RX_RX2 Digital Volume' 84"
		cset "name='LO Switch' 1"
		cset "name='AUX_RDAC Switch' 1"
	]

	DisableSequence [
		cset "name='AUX_RDAC Switch' 0"
		cset "name='LO Switch' 0"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT2_1 MIX1 INP0' RX0"
		cset "name='RX_RX2 Digital Volume' 84"
		cset "name='RDAC3_MUX' RX3"
		cset "name='LO Switch' 1"
		cset "name='EAR_RDAC Switch' 1"
	]

	DisableSequence [
		cset "name='EAR_RDAC Switch' 0"
		cset "name='LO Switch' 0"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Include.rxe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.wcde.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	ConflictingDevice [
		"HeadsetMic"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
	]

	DisableSequence [
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."HeadsetMic" {
	Comment "Headset microphone"

	ConflictingDevice [
		"Mic"
	]

	Include.txe.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf"
	Include.wcde.File "/codecs/wcd937x/HeadphoneMicEnableSeq.conf"
	Include.wcdd.File "/codecs/wcd937x/HeadphoneMicDisableSeq.conf"
	Include.txd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackControl "Mic Jack"
	}
}
